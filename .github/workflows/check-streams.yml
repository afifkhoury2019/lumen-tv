name: Check free streams

on:
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-streams
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test Arabic streams and keep only working ones
        # Arabic-language list plus iptv-org's lists for Arab countries (as suggested in iptv-org discussion #1491).
        run: |
          SOURCES="https://iptv-org.github.io/iptv/languages/ara.m3u"
          for c in sa ae eg qa kw bh om jo lb sy iq ps ye ma dz tn ly sd mr; do
            SOURCES="$SOURCES,https://iptv-org.github.io/iptv/countries/$c.m3u"
          done
          node scripts/check-streams.mjs "$SOURCES" playlists/arabic.m3u

      - name: Commit the updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/arabic.m3u
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update working Arabic streams ($(grep -c '^#EXTINF' playlists/arabic.m3u) channels)"
            git push
          fi
